spring.application.name=nexora-backend

# Datasource. Every value comes from the environment; the password has no
# fallback so a missing DB_PASSWORD fails fast instead of silently trying a
# well-known default that is published with this source.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:nexora_bank}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Access-token signing key. No fallback on purpose: a default would travel with
# the source and allow anyone reading it to forge tokens for any role. Generate
# one with `openssl rand -base64 48` and export it as JWT_SECRET.
app.jwt.secret=${JWT_SECRET}

# Access-token lifetime. Left at the previous 30 days so this change does not
# alter behaviour; see the remediation notes — this should be reduced to
# minutes so the refresh token does the job it exists for.
app.jwt.accessExpirationMs=${JWT_ACCESS_EXPIRATION_MS:2592000000}
app.jwt.refreshExpirationMs=604800000

# One-time code lifetime, enforced in UserService.
app.otp.expirationMs=${OTP_EXPIRATION_MS:600000}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
