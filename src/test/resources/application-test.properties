# Test profile: in-memory database, no external services.
#
# Exists so the security behaviour in this change can be verified without a
# live MySQL instance. Values here are test fixtures, not configuration for any
# real environment.

# NON_KEYWORDS=USER because the User entity maps to a table named "user", which
# H2 treats as reserved and MySQL does not. This only teaches the test database
# to accept the schema the application already uses.
spring.datasource.url=jdbc:h2:mem:nexora_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# A throwaway key of sufficient length, used only by the test context. The
# running application has no default and must be given one by the environment.
app.jwt.secret=test-only-signing-key-not-used-anywhere-outside-tests-0123456789
app.jwt.accessExpirationMs=900000
app.jwt.refreshExpirationMs=604800000
app.otp.expirationMs=600000

# Mail is never actually sent in tests; the sender is stubbed out.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
